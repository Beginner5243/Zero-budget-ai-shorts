name: Kids Cartoon Video

on:
  workflow_dispatch:
    inputs:
      format:
        description: "Video type"
        type: choice
        default: auto
        options:
          - auto
          - animals
          - story
          - rhyme
          - learning

permissions:
  contents: read

jobs:
  kids-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig fonts-noto-core fonts-noto-color-emoji

      - name: Install Python packages
        run: pip install requests edge-tts pillow

      - name: Write script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KIDS_FORMAT: ${{ github.event.inputs.format || 'auto' }}
        run: python kids_main.py

      - name: Render video
        run: python kids_video.py

      - name: Upload kids output
        uses: actions/upload-artifact@v4
        with:
          name: kids-output
          path: output_kids/
          if-no-files-found: warn
