
name: CROWNLESS Anime Trailer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          pip install Pillow edge-tts

      - name: Render Hindi and English trailers
        run: python render.py

      - name: Save finished MP4 files
        uses: actions/upload-artifact@v4
        with:
          name: crownless-trailers
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 3
